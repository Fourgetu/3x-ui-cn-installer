name: Sync official 3x-ui scripts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync official scripts and generate Chinese edition
        run: bash scripts/sync-official.sh

      - name: Commit synced scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-cn.sh x-ui-cn.sh upstream-version.txt
          git diff --cached --quiet || git commit -m "sync: update official 3x-ui Chinese scripts"
          git push
